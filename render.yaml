databases:
  - name: swipster-db
    plan: starter
    databaseName: swipster
    user: swipster

services:
  - type: web
    name: swipster-api
    env: node
    plan: starter
    rootDir: apps/api
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run start:prod
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: swipster-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: EMAIL_FROM
        value: no-reply@swipster.app
      - key: MAX_SWIPES_PER_DAY
        value: 20
      - key: MAX_SKIPS_PER_DAY
        value: 3
      - key: CREDITS_PER_DAY
        value: 100
